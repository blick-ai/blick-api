name: CD ECS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORIO: blick-api
  ECS_CLUSTER: blick-cluster
  ECS_SERVICE: blick-api-service
  API_GATEWAY_ID: 1uzo5w52jk

jobs:
  DeployECS:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aluno_22.00667-2_gha_blickapi_v2
          role-session-name: github-action-blick-api-ecs

      - name: Login no ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORIO:latest .
          docker push $REGISTRY/$ECR_REPOSITORIO:latest

      - name: Forcar novo deployment no ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Esperar o servico ficar estavel
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION

      - name: Resumo do deploy
        run: |
          echo "### Deploy concluido :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- Trafico agora passa pelo ALB (DNS fixo) - nao precisa mais achar IP nem atualizar o API Gateway a cada deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint (sem mudanca): https://$API_GATEWAY_ID.execute-api.$AWS_REGION.amazonaws.com" >> $GITHUB_STEP_SUMMARY